# Builds the site on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://choki-dev.github.io/shingkhar.com/.
# GitHub Pages only hosts static files, so the Contact / Spare Parts / Career forms
# (the /api/form Worker route) only send email on the Cloudflare deployment.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /shingkhar.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # .nojekyll is added by the action, so Pages serves the _astro folder as is
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy site to GitHub Pages"
